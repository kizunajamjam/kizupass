# テストが通ったら GitHub Pages に公開する
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # 公開に必要なファイルだけを載せる(テストや README は含めない)
      - name: Assemble site
        env:
          TZ: Asia/Tokyo
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest css js icons _site/
          node scripts/stamp-version.mjs _site/version.json
          node scripts/build-standalone.mjs _site/kizupass-offline.html _site/version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
